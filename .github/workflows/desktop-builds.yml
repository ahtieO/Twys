name: TWYS Windows setup
on:
  workflow_dispatch:
  push:
    branches: ['codex/twys-windows-installer']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-packaging.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed' }
          python -m pip freeze | Out-File -Encoding utf8 build-requirements.txt
      - name: Build supplied TWYS desktop shortcut icon
        shell: pwsh
        run: |
          python installer/windows/restore_legacy_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'TWYS shortcut icon generation failed' }
      - name: Verify tests before packaging
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=python-tests.xml
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python installer/windows/report-test-failures.py
            exit $testExit
          }
      - name: Build Windows executable
        shell: pwsh
        run: |
          $output = & python BUILD_NATIVE.py 2>&1
          $buildExit = $LASTEXITCODE
          $output | Tee-Object -FilePath pyinstaller-build.log
          if ($buildExit -ne 0) {
            $tail = ($output | Select-Object -Last 35 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$tail"
            exit $buildExit
          }
      - name: Bundle verified Microsoft WebView2 prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/prerequisites | Out-Null
          $runtime = Join-Path $PWD 'build/prerequisites/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtime
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') {
            throw 'WebView2 bootstrapper signature must be valid and issued to Microsoft Corporation'
          }
          Get-FileHash $runtime -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 webview2-checksum.txt
      - name: Create NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $script = (Resolve-Path 'installer/windows/twys.nsi').Path
          $output = & 'C:\Program Files (x86)\NSIS\makensis.exe' $script 2>&1
          $nsisExit = $LASTEXITCODE
          $output | Tee-Object -FilePath nsis-build.log
          if ($nsisExit -ne 0) {
            $tail = ($output | Select-Object -Last 35 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$tail"
            exit $nsisExit
          }
          if (!(Test-Path 'TWYS-Setup.exe')) { throw 'TWYS-Setup.exe was not built at repository root' }
      - name: Verify --self-test and real Windows launch, install, upgrade and uninstall
        shell: pwsh
        run: |
          try { ./installer/windows/verify-install.ps1 }
          catch {
            $message = ($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            exit 1
          }
      - name: Write installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash TWYS-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TWYS-Setup.exe" | Out-File -Encoding ascii TWYS-Setup.exe.sha256
      - name: Upload tested single-file installer
        uses: actions/upload-artifact@v4
        with:
          name: TWYS-Setup-unsigned
          path: |
            TWYS-Setup.exe
            TWYS-Setup.exe.sha256
          if-no-files-found: error
      - name: Stage tested installer download in a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "twys-installer-build-${{ github.run_id }}" TWYS-Setup.exe TWYS-Setup.exe.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft --title 'TWYS 2.9.1 tested Windows installer' --notes 'Tested Windows installer staged for download. This release is a draft and has not been published.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage tested installer download' }
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWYS-Windows-test-results
          path: |
            python-tests.xml
            build-requirements.txt
            pyinstaller-build.log
            nsis-build.log
            webview2-checksum.txt
            ${{ runner.temp }}/twys-windows-validation/*.json
          if-no-files-found: warn
